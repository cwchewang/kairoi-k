<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>House3D</title>
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#20262e;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}#c{width:100%;height:100%;display:block;touch-action:none}.top{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));display:flex;gap:8px;align-items:center;pointer-events:none}.badge{background:rgba(15,18,24,.70);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:#eef3f7;border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:10px 12px;box-shadow:0 12px 32px rgba(0,0,0,.25)}.title{font-weight:700;font-size:14px}.sub{font-size:11px;color:#adb7c2;margin-top:3px}.bottom{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;gap:8px;overflow-x:auto;z-index:20}.bottom button{border:1px solid rgba(255,255,255,.12);background:rgba(20,24,30,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#fff;border-radius:12px;padding:10px 12px;white-space:nowrap;font-size:13px}.bottom button.on{background:rgba(104,163,213,.34);border-color:rgba(150,205,248,.55)}#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#dce6ee;background:#20262e;z-index:50;font-size:14px}.credit{position:fixed;right:12px;bottom:calc(62px + env(safe-area-inset-bottom));font-size:10px;color:#aab5bf;background:rgba(15,18,24,.62);padding:6px 8px;border-radius:8px}.joy{display:none;position:fixed;left:22px;bottom:calc(82px + env(safe-area-inset-bottom));width:112px;height:112px;border-radius:56px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);pointer-events:none;z-index:15}.joy:after{content:'';position:absolute;left:33px;top:33px;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.30);border:1px solid rgba(255,255,255,.34);transform:translate(var(--jx,0px),var(--jy,0px))}.walkhint{display:none;position:fixed;right:14px;bottom:calc(80px + env(safe-area-inset-bottom));color:#e7edf3;background:rgba(15,18,24,.62);padding:7px 9px;border-radius:9px;font-size:10px;pointer-events:none}.walk .joy,.walk .walkhint{display:block}@media(max-width:520px){.sub{max-width:70vw}.credit{display:none}}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.166.1/build/three.module.js","three/addons/":"https://unpkg.com/three@0.166.1/examples/jsm/"}}</script></head><body><div id="loading">正在加载 Blender 场景…</div><canvas id="c"></canvas><div class="top"><div class="badge"><div class="title">House3D · 实景化版本</div><div class="sub">PBR 材质 · 真实家具模型 · iPhone 触控 · 免费云 Blender 构建</div></div></div><div class="joy" id="joy"></div><div class="walkhint">左侧摇杆移动 · 右侧拖动转向</div><div class="bottom"><button id="doll" class="on">模型</button><button id="top">鸟瞰</button><button id="walk">漫游</button><button id="walls">外墙：隐藏</button></div><div class="credit">Assets: Poly Haven · CC0</div>
<script type="module">import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';
const canvas=document.querySelector('#c'),renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight,false);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x303943);scene.fog=new THREE.Fog(0x303943,18,34);const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.05,100);camera.up.set(0,1,0);const controls=new OrbitControls(camera,canvas);controls.enableDamping=true;controls.dampingFactor=.06;controls.minDistance=2.5;controls.maxDistance=22;controls.maxPolarAngle=Math.PI*.49;
scene.add(new THREE.HemisphereLight(0xfff8ec,0x52606c,1.45));const sun=new THREE.DirectionalLight(0xfff0d5,2.25);sun.position.set(-5,10,6);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-12;sun.shadow.camera.right=12;sun.shadow.camera.top=12;sun.shadow.camera.bottom=-12;scene.add(sun);const fill=new THREE.DirectionalLight(0xcfe5ff,.72);fill.position.set(8,6,-4);scene.add(fill);
let model,box,center=new THREE.Vector3(),maxDim=8,cutaway,mode='doll';const active=id=>document.querySelectorAll('.bottom button').forEach(b=>b.classList.toggle('on',b.id===id));
function dollView(){if(!model)return;mode='doll';document.body.classList.remove('walk');controls.enabled=true;camera.fov=50;camera.updateProjectionMatrix();camera.position.set(center.x+maxDim*.92,center.y+maxDim*.78,center.z-maxDim*1.05);controls.target.copy(center).add(new THREE.Vector3(0,-maxDim*.08,0));controls.update();if(cutaway)cutaway.visible=false;document.querySelector('#walls').textContent='外墙：隐藏';active('doll')}
function topView(){if(!model)return;mode='top';document.body.classList.remove('walk');controls.enabled=true;camera.fov=48;camera.updateProjectionMatrix();camera.position.set(center.x,center.y+maxDim*1.55,center.z+.01);controls.target.copy(center);controls.update();active('top')}
let yaw=0,pitch=0,walkPos=new THREE.Vector3(),joy={x:0,y:0},joyId=null,lookId=null,lastLook=null;
function enterWalk(){if(!model)return;mode='walk';controls.enabled=false;document.body.classList.add('walk');active('walk');camera.fov=64;camera.updateProjectionMatrix();const mn=box.min,mx=box.max;walkPos.set(mn.x+(mx.x-mn.x)*.23,mn.y+1.58,mn.z+(mx.z-mn.z)*.40);yaw=Math.PI;pitch=0;camera.position.copy(walkPos);updateWalkCamera()}
function updateWalkCamera(){const dir=new THREE.Vector3(Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),-Math.cos(yaw)*Math.cos(pitch));camera.position.copy(walkPos);camera.lookAt(walkPos.clone().add(dir))}
new GLTFLoader().load('./scene.glb',g=>{model=g.scene;scene.add(model);model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});box=new THREE.Box3().setFromObject(model);box.getCenter(center);const s=box.getSize(new THREE.Vector3());maxDim=Math.max(s.x,s.y,s.z);cutaway=model.getObjectByName('CUTAWAY_WALLS');if(cutaway)cutaway.visible=false;dollView();document.querySelector('#loading').remove();},p=>{if(p.total){document.querySelector('#loading').textContent=`正在加载场景 ${Math.round(p.loaded/p.total*100)}%`}},e=>{document.querySelector('#loading').textContent='场景加载失败：'+e.message});
document.querySelector('#doll').onclick=dollView;document.querySelector('#top').onclick=topView;document.querySelector('#walk').onclick=enterWalk;document.querySelector('#walls').onclick=()=>{if(!cutaway)return;cutaway.visible=!cutaway.visible;document.querySelector('#walls').textContent=`外墙：${cutaway.visible?'显示':'隐藏'}`};
function joyUpdate(x,y){const r=document.querySelector('#joy').getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=x-cx,dy=y-cy;const m=34,l=Math.hypot(dx,dy)||1;if(l>m){dx*=m/l;dy*=m/l}joy={x:dx/m,y:dy/m};document.querySelector('#joy').style.setProperty('--jx',dx+'px');document.querySelector('#joy').style.setProperty('--jy',dy+'px')}
function joyReset(){joy={x:0,y:0};document.querySelector('#joy').style.setProperty('--jx','0px');document.querySelector('#joy').style.setProperty('--jy','0px')}
canvas.addEventListener('pointerdown',e=>{if(mode!=='walk')return;canvas.setPointerCapture(e.pointerId);if(e.clientX<innerWidth*.48&&joyId===null){joyId=e.pointerId;joyUpdate(e.clientX,e.clientY)}else if(lookId===null){lookId=e.pointerId;lastLook={x:e.clientX,y:e.clientY}}});
canvas.addEventListener('pointermove',e=>{if(mode!=='walk')return;if(e.pointerId===joyId)joyUpdate(e.clientX,e.clientY);else if(e.pointerId===lookId&&lastLook){const dx=e.clientX-lastLook.x,dy=e.clientY-lastLook.y;yaw-=dx*.0045;pitch=THREE.MathUtils.clamp(pitch-dy*.0038,-1.05,1.05);lastLook={x:e.clientX,y:e.clientY};updateWalkCamera()}});
function pointerEnd(e){if(e.pointerId===joyId){joyId=null;joyReset()}if(e.pointerId===lookId){lookId=null;lastLook=null}}canvas.addEventListener('pointerup',pointerEnd);canvas.addEventListener('pointercancel',pointerEnd);
let last=performance.now();renderer.setAnimationLoop(t=>{const dt=Math.min(.04,(t-last)/1000);last=t;if(mode==='walk'&&box){const forward=new THREE.Vector3(Math.sin(yaw),0,-Math.cos(yaw)),right=new THREE.Vector3(Math.cos(yaw),0,Math.sin(yaw));walkPos.addScaledVector(forward,-joy.y*2.0*dt).addScaledVector(right,joy.x*2.0*dt);walkPos.x=THREE.MathUtils.clamp(walkPos.x,box.min.x+.18,box.max.x-.18);walkPos.z=THREE.MathUtils.clamp(walkPos.z,box.min.z+.18,box.max.z-.18);updateWalkCamera()}controls.update();renderer.render(scene,camera)});
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});
</script></body></html>
