<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>House3D</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#15191f;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}#c{width:100%;height:100%;display:block;touch-action:none}.top{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));display:flex;gap:8px;align-items:center;pointer-events:none}.badge{background:rgba(15,18,24,.72);backdrop-filter:blur(16px);color:#eef3f7;border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:10px 12px;box-shadow:0 12px 32px rgba(0,0,0,.25)}.title{font-weight:700;font-size:14px}.sub{font-size:11px;color:#adb7c2;margin-top:3px}.bottom{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;gap:8px;overflow-x:auto}.bottom button{border:1px solid rgba(255,255,255,.12);background:rgba(20,24,30,.76);backdrop-filter:blur(14px);color:#fff;border-radius:12px;padding:10px 12px;white-space:nowrap}.bottom button.on{background:rgba(104,163,213,.32);border-color:rgba(150,205,248,.5)}#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#dce6ee;background:#15191f;z-index:10;font-size:14px}.credit{position:fixed;right:12px;bottom:calc(62px + env(safe-area-inset-bottom));font-size:10px;color:#aab5bf;background:rgba(15,18,24,.6);padding:6px 8px;border-radius:8px}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.166.1/build/three.module.js","three/addons/":"https://unpkg.com/three@0.166.1/examples/jsm/"}}</script></head><body><div id="loading">正在加载高质量 3D 场景…</div><canvas id="c"></canvas><div class="top"><div class="badge"><div class="title">House3D · Blender 场景</div><div class="sub">真实 PBR 材质 · 开源家具资产 · iPhone 触控</div></div></div><div class="bottom"><button id="doll" class="on">模型</button><button id="top">鸟瞰</button><button id="inside">室内</button><button id="walls">外墙剖切</button></div><div class="credit">Assets: Poly Haven (CC0)</div>
<script type="module">import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';
const canvas=document.querySelector('#c'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight,false);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x303943);scene.fog=new THREE.Fog(0x303943,16,30);const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.05,100);camera.position.set(9,-10,8);camera.up.set(0,0,1);const controls=new OrbitControls(camera,canvas);controls.target.set(3.6,2.5,1.0);controls.enableDamping=true;controls.dampingFactor=.06;controls.minDistance=2.5;controls.maxDistance=20;controls.maxPolarAngle=Math.PI*.49;
scene.add(new THREE.HemisphereLight(0xffffff,0x56616d,1.25));const sun=new THREE.DirectionalLight(0xfff4df,2.2);sun.position.set(-4,-5,10);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-12;sun.shadow.camera.right=12;sun.shadow.camera.top=12;sun.shadow.camera.bottom=-12;scene.add(sun);const fill=new THREE.DirectionalLight(0xcfe5ff,.8);fill.position.set(8,3,5);scene.add(fill);
let model;new GLTFLoader().load('./scene.glb',g=>{model=g.scene;scene.add(model);model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});document.querySelector('#loading').remove();},p=>{},e=>{document.querySelector('#loading').textContent='场景加载失败：'+e.message});
function view(pos,target){camera.position.copy(pos);controls.target.copy(target);controls.update()}document.querySelector('#doll').onclick=()=>view(new THREE.Vector3(9,-10,8),new THREE.Vector3(3.6,2.5,1));document.querySelector('#top').onclick=()=>view(new THREE.Vector3(3.6,2.7,13),new THREE.Vector3(3.6,2.7,0));document.querySelector('#inside').onclick=()=>view(new THREE.Vector3(1.3,3.4,1.65),new THREE.Vector3(2.6,2.1,1.4));document.querySelectorAll('.bottom button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.bottom button').forEach(x=>x.classList.remove('on'));b.classList.add('on')}));document.querySelector('#walls').onclick=()=>{if(!model)return;const w=model.getObjectByName('CUTAWAY_WALLS');if(w)w.visible=!w.visible};
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
</script></body></html>
